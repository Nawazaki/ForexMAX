backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "articles"
    label: "Institutional Articles"
    folder: "articles"
    create: true
    slug: "{{slug}}"
    extension: "html"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Tag/Badge", name: "tag", widget: "string", default: "Latest Report" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    delete: false
    files:
      - name: "homepage"
        label: "Homepage Content"
        file: "_data/homepage.json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
          - label: "Market Stats"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Value", name: "value", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - label: "Institutional Brokers"
            name: "brokers"
            widget: "list"
            fields:
              - { label: "Broker Name", name: "name", widget: "string" }
              - { label: "Spread", name: "spread", widget: "string" }
              - { label: "Execution", name: "execution", widget: "string" }
              - { label: "Leverage", name: "leverage", widget: "string" }
          - { label: "Security Notice", name: "security_notice", widget: "text" }
          - { label: "Contact Email", name: "contact_email", widget: "string" }
